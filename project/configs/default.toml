# Paths are relative to project/, regardless of the current working directory.
[data]
directory = "../dataset_cleaned"
# Retain complete histories of a reproducible sample of users; 1.0 uses all users.
user_sample_fraction = 0.02
chunksize = 500000
train_fraction = 0.7
validation_fraction = 0.15

[experiment]
seed = 42
artifacts_directory = "artifacts"
algorithms = ["ridge", "xgboost", "svd", "ncf"]

[models.ridge]
alpha = 10.0

[models.xgboost]
n_estimators = 160
max_depth = 6
learning_rate = 0.05
n_jobs = 4

[models.ncf]
factors = 16
hidden_size = 32
epochs = 12
batch_size = 2048
learning_rate = 0.003
regularization = 0.01
dropout = 0.1
patience = 3
profile_steps = 60

[models.baseline]
epochs = 10
regularization = 10.0

[models.item_knn]
neighbors = 40
block_size = 64

[models.svd]
factors = 32
epochs = 15
learning_rate = 0.005
regularization = 0.02

[models.nmf]
factors = 32
epochs = 15
learning_rate = 0.002
regularization = 0.02
